name: Cross-platform checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --global @openai/codex
      - run: npm run setup -- --client codex --no-login
      - run: codex mcp get google-pro
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm test
      - if: runner.os == 'Windows'
        run: npx tsx --test test/gemini.test.ts test/install.test.ts test/mcp.test.ts
